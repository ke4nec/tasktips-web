# 静态托管备选（无 Caddy 时）：/app/ 基座 + history fallback + API 反代。
# 后端地址经环境变量替换后使用（envsubst），或直接改写 proxy_pass。
#
# 安全头统一在 snippets/security-headers.conf，server 级与两个静态 location
# 各 include 一次（add_header 不跨级继承，原因见该文件注释）。

server {
    listen 8080;
    server_name _;

    # 重定向用相对 Location：absolute_redirect 默认 on 时，Host 不带端口的
    # 请求会被重定向到 <host>:8080（容器监听端口，外部不可达）。
    absolute_redirect off;

    # 根路径重定向 /app/
    location = / {
        return 308 /app/;
    }

    # Web 静态：/app/ 基座，fallback 仅限其内
    location /app/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 版本化构建产物长期缓存（文件名含哈希）。必须用 ^~ 前缀匹配：正则
    # location 配 alias 且不带捕获组时，nginx 会把整个 URI 映射为 alias
    # 目录本身，对每个资源都返回 301 目录重定向（Location 指向容器自身
    # 端口，外部不可达），页面所有 JS/CSS 均无法加载。
    location ^~ /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 后端 API 反代（同源）
    location /api/ {
        proxy_pass http://tasktips-api:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 无自有 add_header 的 location（重定向、API 反代）继承以下安全头
    include /etc/nginx/snippets/security-headers.conf;
}
