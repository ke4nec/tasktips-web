# 静态托管备选（无 Caddy 时）：/app/ 基座 + history fallback + API 反代。
# 后端地址经环境变量替换后使用（envsubst），或直接改写 proxy_pass。

server {
    listen 8080;
    server_name _;

    # 根路径重定向 /app/
    location = / {
        return 308 /app/;
    }

    # Web 静态：/app/ 基座，fallback 仅限其内
    location /app/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # 版本化构建产物长期缓存（文件名含哈希）
    location ~ ^/app/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 后端 API 反代（同源）
    location /api/ {
        proxy_pass http://tasktips-api:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 安全头（与 Caddyfile.example 保持一致）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-b/XM5jRsCiecT9sQztRFt/dIv6Gj22FtfxAlY/lotn0='; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}
