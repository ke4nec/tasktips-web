# 安全头片段（与 Caddyfile.example 保持一致）。nginx 的 add_header 不跨级
# 继承：location 内一旦声明任何 add_header（如 Cache-Control），server 级
# include 的本片段就会被该 location 丢弃，因此两个静态 location 需再次
# include。内联引导脚本哈希变更时同步更新（生成命令见 Caddyfile.example）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-b/XM5jRsCiecT9sQztRFt/dIv6Gj22FtfxAlY/lotn0='; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
