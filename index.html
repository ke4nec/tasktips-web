<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- /app/ 为设计文档固定的部署路径（§11.2），public 资源用其绝对路径，dev/prod 一致 -->
    <link rel="icon" href="/app/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#0078D4" />
    <meta
      name="description"
      content="TaskTips Web：受邀注册、登录即用、离线记录、多端接续的任务工作台"
    />
    <title>TaskTips Web</title>
    <!-- 同源阻塞脚本在首帧应用主题，CSP 仅需 script-src self。 -->
    <script src="/app/theme-boot.js" vite-ignore></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
