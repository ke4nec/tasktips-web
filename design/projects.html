  <script>window.TASKTIPS_DESIGN={"page": "projects", "title": "项目空间", "states": ["normal", "empty", "offline"], "sampleMarkdown": "# 完善 TaskTips Web 设计稿\n\n让任务、记录与灵感，在网页中自然连接。\n\n## 这次想做到的事\n\n沿用桌面端熟悉的蓝色，把移动端的轻盈带到更宽的屏幕上。打开网页，就能继续手边的事情。\n\n> 保持简单，把空间留给真正重要的内容。\n\n## 设计检查清单\n\n- [x] 确定页面结构与导航\n- [x] 整理浅色与深色主题\n- [ ] 完成即时与分栏编辑两种模式\n- [ ] 检查小屏幕下的编辑体验\n- [ ] 补齐离线、空态和错误状态\n\n## 交互备注\n\n编辑内容自动保存。切换编辑模式时，正文、选区和撤销记录都应该留下来。\n\n1. 从今日列表打开任务\n2. 随手记录，随时继续\n3. 完成后勾选，不必手动保存\n\n---\n\n下一步：和桌面端、移动端一起，检查整个使用流程。\n", "tasks": [{"id": "review", "title": "整理上周产品评审记录", "description": "把讨论变成清晰的下一步"}, {"id": "read", "title": "读完《设计中的设计》第二章", "description": "留一点时间给新的视角"}, {"id": "design", "title": "完善 TaskTips Web 设计稿", "description": "让任务、记录与灵感，在网页中自然连接"}, {"id": "walk", "title": "傍晚散步 30 分钟", "description": "放下屏幕，看看今天的天空"}, {"id": "sync", "title": "核对多端同步的交互细节", "description": "离线状态、冲突处理与自动保存"}, {"id": "weekend", "title": "计划周末的短途旅行", "description": "天气、路线和想去的小店"}, {"id": "notes", "title": "整理本周学习笔记", "description": "把零散知识串成自己的理解"}, {"id": "plant", "title": "给阳台的植物浇水", "description": "记得看看新叶子"}, {"id": "demo", "title": "准备产品演示", "description": "从一条任务讲起"}, {"id": "book", "title": "列出十月阅读书单", "description": "两本技术书，一本文学作品"}, {"id": "ideas", "title": "收集有意思的网页交互", "description": "键盘、布局和细微的反馈"}, {"id": "coffee", "title": "试试街角新开的咖啡店", "description": "周日下午的一个小计划"}, {"id": "theme", "title": "确定明暗主题的品牌色", "description": "保持桌面、移动与网页端的视觉一致"}, {"id": "backup", "title": "导出一份任务备份", "description": "给重要的记录留一个副本"}, {"id": "desk", "title": "整理工作台", "description": "清理桌面，也清理思绪"}]};</script>
