  <script>window.TASKTIPS_DESIGN={"page": "onboarding", "title": "初始化工作区", "states": ["normal", "error", "offline"], "sampleMarkdown": "# 完善 TaskTips Web 设计稿\n\n让任务、记录与灵感，在网页中自然连接。\n\n## 这次想做到的事\n\n沿用桌面端熟悉的蓝色，把移动端的轻盈带到更宽的屏幕上。打开网页，就能继续手边的事情。\n\n> 保持简单，把空间留给真正重要的内容。\n\n## 设计检查清单\n\n- [x] 确定页面结构与导航\n- [x] 整理浅色与深色主题\n- [ ] 完成即时与分栏编辑两种模式\n- [ ] 检查小屏幕下的编辑体验\n- [ ] 补齐离线、空态和错误状态\n\n## 交互备注\n\n编辑内容自动保存。切换编辑模式时，正文、选区和撤销记录都应该留下来。\n\n1. 从今日列表打开任务\n2. 随手记录，随时继续\n3. 完成后勾选，不必手动保存\n\n---\n\n下一步：和桌面端、移动端一起，检查整个使用流程。\n", "tasks": [{"id": "review", "title": "整理上周产品评审记录", "description": "把讨论变成清晰的下一步"}, {"id": "read", "title": "读完《设计中的设计》第二章", "description": "留一点时间给新的视角"}, {"id": "design", "title": "完善 TaskTips Web 设计稿", "description": "让任务、记录与灵感，在网页中自然连接"}, {"id": "walk", "title": "傍晚散步 30 分钟", "description": "放下屏幕，看看今天的天空"}, {"id": "sync", "title": "核对多端同步的交互细节", "description": "离线状态、冲突处理与自动保存"}, {"id": "weekend", "title": "计划周末的短途旅行", "description": "天气、路线和想去的小店"}, {"id": "notes", "title": "整理本周学习笔记", "description": "把零散知识串成自己的理解"}, {"id": "plant", "title": "给阳台的植物浇水", "description": "记得看看新叶子"}, {"id": "demo", "title": "准备产品演示", "description": "从一条任务讲起"}, {"id": "book", "title": "列出十月阅读书单", "description": "两本技术书，一本文学作品"}, {"id": "ideas", "title": "收集有意思的网页交互", "description": "键盘、布局和细微的反馈"}, {"id": "coffee", "title": "试试街角新开的咖啡店", "description": "周日下午的一个小计划"}, {"id": "theme", "title": "确定明暗主题的品牌色", "description": "保持桌面、移动与网页端的视觉一致"}, {"id": "backup", "title": "导出一份任务备份", "description": "给重要的记录留一个副本"}, {"id": "desk", "title": "整理工作台", "description": "清理桌面，也清理思绪"}]};</script>

<div class="standalone"><header class="standalone-header"><a class="logo" href="today.html"><span class="logo-mark"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z"/><path d="m8 12 3 3 5-6"/></svg></span>TaskTips</a><a class="flex muted small" href="account.html"><span class="avatar">林</span>林间<svg class="icon small" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></a></header><section class="panel loading-card"><div class="feature-icon" style="background:var(--brand-soft);color:var(--brand);margin-bottom:22px"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19a5 5 0 1 1-.7-10 7 7 0 0 1 13.5-1A5.5 5.5 0 0 1 18 19H6Z"/></svg></div><h1 style="font-size:24px">正在为你准备工作区</h1><p class="muted small" style="margin:10px 0 26px">首次使用需要下载“我的任务”。以后打开就能继续记录。</p><div class="between small" style="margin-bottom:9px"><span>项目初始化</span><span class="blue" id="init-percent">78%</span></div><div class="progress-track"><span id="init-progress" style="width:78%"></span></div><div class="mt"><div class="step-row complete"><span class="step-number"><svg class="icon small" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></span><div class="grow">验证账号与设备<div class="subtle small">Web 浏览器已连接</div></div><span class="pill green">已完成</span></div><div class="step-row complete"><span class="step-number"><svg class="icon small" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></span><div class="grow">下载任务和分类<div class="subtle small">15 条任务 · 3 个目录</div></div><span class="pill green">已完成</span></div><div class="step-row current"><span class="step-number">3</span><div class="grow">准备离线图片<div class="subtle small">正在保存 2 / 3 张图片</div></div><span class="pill blue">进行中</span></div><div class="step-row "><span class="step-number">4</span><div class="grow">建立离线工作区<div class="subtle small">完成后即可断网使用</div></div><span class="pill ">等待中</span></div></div><div class="mt"><button type="button" data-action="finish-init" class="btn primary full" ><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>完成下载并进入</button></div><p class="muted small" style="margin-top:16px">此过程中可以安全离开，下次回来会继续准备。</p></section></div>
