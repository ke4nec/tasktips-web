name: Docker Publish

# Builds the TaskTips Web image and publishes it to Docker Hub:
#   - push to master -> latest only
#   - push of a v* tag -> vX.Y.Z, X.Y.Z, X.Y
# Pull requests only build the image so Dockerfile changes are validated
# without publishing anything.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME - Docker Hub account or organization name
#   DOCKERHUB_TOKEN    - Docker Hub access token
#
# Optional repository variable:
#   DOCKERHUB_REPOSITORY - defaults to ke4nec/tasktips-web

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push web image
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image repository
        id: repo
        run: echo "name=${DOCKERHUB_REPOSITORY:-ke4nec/tasktips-web}" >> "$GITHUB_OUTPUT"
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.name }}
          # Branch pushes publish only the floating `latest`; version tags
          # come exclusively from `vX.Y.Z` release tags (no `master`/`sha-*`
          # aliases — pin deployments to a release tag instead). The pr-N tag
          # only names build-only validation images; PRs never push.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=TaskTips Web

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          platforms: linux/amd64
          # Pull requests validate the Dockerfile without publishing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true

      - name: Show published digest
        if: github.event_name != 'pull_request'
        run: echo "Published ${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}"

      - name: Clean up builder cache and dangling images
        if: always()
        run: |
          docker buildx prune --force --keep-storage 2GB
          docker image prune --force
          docker system df
